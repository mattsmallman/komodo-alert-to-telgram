name = "komodo-alert-to-telegram"
main = "app.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Secrets are set with `wrangler secret put` (see README).
# For local development, copy .dev.vars.example to .dev.vars.
[vars]
DEBOUNCE_SECONDS = "60"
TIMEZONE = "UTC"

[durable_objects]
bindings = [
  { name = "ALERT_DEBOUNCER", class_name = "AlertDebouncer" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AlertDebouncer"]

[observability.logs]
enabled = true
